<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="iconBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="iconGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.2" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer camera lens ring -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="#171717" stroke="url(#iconBlueGrad)" stroke-width="2.5" />
  <rect x="9" y="9" width="82" height="82" rx="18" fill="url(#iconGlowGrad)" fill-opacity="0.15" />

  <!-- Isometric Aperture / Pixels Blade System -->
  <g transform="translate(25, 25)">
    <!-- Top Left Pixel Blade -->
    <path d="M4 14 L24 4 L24 22 L4 22 Z" fill="url(#iconBlueGrad)" />
    <!-- Top Right Pixel Blade -->
    <path d="M26 4 L46 14 L36 30 L26 22 Z" fill="#38bdf8" />
    <!-- Bottom Right Pixel Blade -->
    <path d="M46 36 L26 46 L26 28 L46 28 Z" fill="url(#iconBlueGrad)" />
    <!-- Bottom Left Pixel Blade -->
    <path d="M24 46 L4 36 L14 20 L24 28 Z" fill="#2563eb" />
    <!-- Central Focus Aperture Dot -->
    <circle cx="25" cy="25" r="4.5" fill="#f1f2ed" filter="url(#iconGlow)" />
    <circle cx="25" cy="25" r="2" fill="#38bdf8" />
  </g>

  <!-- Corner Technical Cine Crosshairs -->
  <path d="M12 18 L18 18 M18 12 L18 18" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M88 18 L82 18 M82 12 L82 18" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M12 82 L18 82 M18 88 L18 82" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <path d="M88 82 L82 82 M82 88 L82 82" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
</svg>
